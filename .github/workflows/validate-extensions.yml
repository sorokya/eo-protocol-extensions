name: Validate Extensions

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.9", "3.11", "3.13" ]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install eolib-ext
        run: pip install -e .

      - name: Write extensions config
        run: |
          cat > extensions.xml << 'EOF'
          <extensions>
            <extension type="file" name="deep" path="extensions/deep" />
          </extensions>
          EOF

      - name: Validate official extensions
        run: eolib-ext validate --config=extensions.xml
